apiVersion: v1
kind: ConfigMap
metadata:
  name: ugc-marketplace-config
  namespace: ugc-marketplace
  labels:
    app: ugc-marketplace
    tier: backend
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  DB_HOST: "postgres.ugc-marketplace.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "ugc_marketplace"
  DB_POOL_MIN: "2"
  DB_POOL_MAX: "10"
  REDIS_HOST: "redis.ugc-marketplace.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CACHE_TTL_SECONDS: "300"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  CORS_ALLOWED_ORIGINS: "https://ugc-marketplace.example.com"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  TRACING_ENABLED: "true"
  TRACING_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
