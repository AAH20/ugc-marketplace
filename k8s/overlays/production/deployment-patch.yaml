apiVersion: apps/v1
kind: Deployment
metadata:
  name: ugc-marketplace-api
  namespace: ugc-marketplace
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
