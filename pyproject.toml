[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ugc-marketplace"
version = "0.1.0"
description = "Cost-optimized model routing for UGC marketplace"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
