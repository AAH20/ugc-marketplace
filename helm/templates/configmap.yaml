apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ugc-marketplace.fullname" . }}-config
  labels:
    {{- include "ugc-marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  {{- /*
    ConfigMap data values must be strings. .Values.config is a nested map, so a
    bare toYaml emits nested objects under `data` and fails API schema
    validation. Range the top-level keys and stringify each leaf instead.
  */}}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toJson | quote }}
  {{- end }}
